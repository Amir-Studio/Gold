name: Update market snapshot and history

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch prices and append permanent history
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone

          base = "https://raw.githubusercontent.com/iran-market/iran-market.github.io/main/data/"
          urls = [base + "popular.json", base + "latest-toman.json"]
          merged, metadata = {}, {}
          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent": "Gold-Market-Snapshot/2.0"})
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              if isinstance(payload.get("meta"), dict):
                  metadata.update(payload["meta"])
              raw = payload.get("data", [])
              if isinstance(raw, dict):
                  raw = [item for group in raw.get("categories", raw).values() if isinstance(group, list) for item in group]
              if not isinstance(raw, list):
                  raise ValueError("Unexpected market data format: " + url)
              for item in raw:
                  if isinstance(item, dict) and item.get("symbol") and item.get("price") is not None:
                      merged.setdefault(item["symbol"], item)
          if not merged:
              raise RuntimeError("No valid market records received; refusing to overwrite the last snapshot.")

          os.makedirs("data/history", exist_ok=True)
          now = datetime.now(timezone.utc).isoformat()
          for symbol in ("USD_IRR_FREE", "GOLD_18K_IRR"):
              path = f"data/history/{symbol}.json"
              points = []
              if os.path.exists(path):
                  try:
                      old = json.load(open(path, encoding="utf-8"))
                      points = old if isinstance(old, list) else old.get("data", old.get("history", []))
                  except Exception:
                      points = []
              if not points:
                  source_url = base + "history/" + symbol + ".json"
                  try:
                      req = urllib.request.Request(source_url, headers={"User-Agent": "Gold-Market-History/2.0"})
                      with urllib.request.urlopen(req, timeout=40) as response:
                          historical = json.load(response)
                      if isinstance(historical, list):
                          points.extend(historical)
                      elif isinstance(historical, dict):
                          candidate = historical.get("data", historical.get("history", historical.get("items", [])))
                          if isinstance(candidate, list):
                              points.extend(candidate)
                      print(f"Imported {len(points)} source history points for {symbol}")
                  except Exception as exc:
                      print(f"Historical seed unavailable for {symbol}: {exc}")
              record = merged.get(symbol)
              if record and float(record.get("price") or 0) > 0:
                  stamp = record.get("timestamp") or record.get("checked_at") or record.get("updated_at") or now
                  points.append({"date": stamp, "value": float(record["price"]), "recorded_at": now})
              normalized = {}
              for point in points:
                  if not isinstance(point, dict):
                      continue
                  date = point.get("date") or point.get("timestamp") or point.get("day") or point.get("datetime") or point.get("time")
                  value = point.get("value", point.get("close", point.get("price", point.get("rate", point.get("last", point.get("c"))))))
                  try:
                      value = float(value)
                      stamp = datetime.fromisoformat(str(date).replace("Z", "+00:00"))
                      if stamp.tzinfo is None:
                          stamp = stamp.replace(tzinfo=timezone.utc)
                      key = stamp.astimezone(timezone.utc).isoformat()
                      if value > 0:
                          normalized[key] = {"date": key, "value": value}
                  except Exception:
                      continue
              history = sorted(normalized.values(), key=lambda p: p["date"])
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(history, f, ensure_ascii=False, separators=(",", ":"))
              print(f"Saved {len(history)} historical points for {symbol}")

          result = {"meta": {**metadata, "source": metadata.get("source") or "Iran Market Data",
                             "snapshot_updated_at": now, "history_updated_at": now},
                    "data": list(merged.values())}
          with open("data/market.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(merged)} assets to data/market.json")
          PY
      - name: Commit snapshot and historical archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json data/history/
          if git diff --cached --quiet; then
            echo "Market data and history unchanged."
          else
            git commit -m "chore: refresh prices and append historical archive"
            git push
          fi
