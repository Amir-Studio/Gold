name: Update market snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and merge latest market data
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          urls = [
              "https://raw.githubusercontent.com/iran-market/iran-market.github.io/main/data/popular.json",
              "https://raw.githubusercontent.com/iran-market/iran-market.github.io/main/data/latest-toman.json",
          ]

          merged = {}
          metadata = {}
          for url in urls:
              req = urllib.request.Request(url, headers={"User-Agent": "Gold-Market-Snapshot/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict) or "data" not in payload:
                  raise ValueError("Unexpected market data format: " + url)
              if isinstance(payload.get("meta"), dict):
                  metadata.update(payload["meta"])
              raw_data = payload["data"]
              if isinstance(raw_data, list):
                  items = raw_data
              elif isinstance(raw_data, dict):
                  categories = raw_data.get("categories", raw_data)
                  items = []
                  for group in categories.values():
                      if isinstance(group, list):
                          items.extend(group)
              else:
                  raise ValueError("Unsupported data structure: " + url)
              for item in items:
                  if isinstance(item, dict) and item.get("symbol") and item.get("price") is not None:
                      # Keep the popular feed's record if a symbol appears in both feeds.
                      merged.setdefault(item["symbol"], item)

          if not merged:
              raise RuntimeError("No valid market records received; keeping previous snapshot.")

          result = {
              "meta": {
                  **metadata,
                  "source": metadata.get("source") or "Iran Market Data",
                  "snapshot_updated_at": datetime.now(timezone.utc).isoformat(),
              },
              "data": list(merged.values()),
          }
          os.makedirs("data", exist_ok=True)
          with open("data/market.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(merged)} assets to data/market.json")
          PY
      - name: Commit snapshot only when it changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "Market snapshot unchanged; no commit needed."
          else
            git commit -m "chore: refresh market data snapshot"
            git push
          fi
