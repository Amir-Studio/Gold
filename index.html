
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>۹ بخش مرموز</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="homePage" class="page">
      <h1>برای امنیت بیشتر، سایت را به ۹ بخش تقسیم کردیم!</h1>
      <p class="subtitle">یکی رو انتخاب کن👀</p>
      <div id="sections" class="grid"></div>
    </section>

    <section id="adPage" class="page hidden">
      <h1>برای ادامه، ابتدا یک ویدیوی تبلیغاتی ببینید!</h1>
      <div class="ad-box">
        <p>📢 محل نمایش تبلیغ</p>
        <p id="adStatus">تبلیغ آزمایشی</p>
        <button id="watchAd">مشاهده تبلیغ آزمایشی</button>
      </div>
      <button class="secondary" id="backHome">بازگشت</button>
    </section>

    <section id="finalPage" class="page hidden">
      <h1>❗️خطا</h1>
      <p id="finalMessage"></p>
      <button id="again">برگشت به صفحه اول</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
