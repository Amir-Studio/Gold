<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="۹ بخش مرموز؛ یک تجربه کوتاه، رازآلود و متفاوت.">
  <title>۹ بخش مرموز | پرونده محرمانه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="صفحه اصلی ۹ بخش مرموز">
        <span class="brand-mark">۹</span>
        <span><strong>پروندهٔ نُه</strong><small>THE NINE FILES</small></span>
      </a>
      <span class="top-status"><span class="status-dot"></span> پرونده باز است</span>
    </header>

    <section class="hero">
      <div class="eyebrow"><span class="eyebrow-line"></span> پرونده شماره ۰۰۹ <span class="eyebrow-line"></span></div>
      <h1>همه‌چیز از یک <span class="gold-text">انتخاب</span> شروع می‌شود.</h1>
      <p class="hero-copy">۹ بخش پیش روی توست. یکی را انتخاب کن و قدم بعدی پرونده را کشف کن.</p>
      <div class="hero-rule"><span></span><span></span><span></span></div>
    </section>

    <section class="selection-panel" aria-labelledby="selection-title">
      <div class="panel-heading">
        <div>
          <p class="section-kicker">مرحلهٔ اول / انتخاب</p>
          <h2 id="selection-title">کدام در را باز می‌کنی؟</h2>
        </div>
        <span class="count-badge">۰۹ <span>/ ۰۹</span></span>
      </div>
      <div id="sections" class="grid" aria-label="انتخاب یکی از نه بخش"></div>
      <p class="fine-print"><span class="lock-icon" aria-hidden="true">◇</span> هر انتخاب تو را به مرحلهٔ بعد می‌برد.</p>
    </section>

    <footer class="footer">
      <span>۹ بخش مرموز</span>
      <span class="footer-separator">•</span>
      <span>یک تجربهٔ تعاملی</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
